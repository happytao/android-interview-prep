<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="description" content="个人技术面试复习站：面向 Android 中级开发工程师的原理拆解、图解流程与自测知识库。" />
    <title>技术面试复习站 · Android 中级开发题库</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      (function () {
        var lightBg = '#FFFFFF';
        var darkBg = '#09090B';
        var mode = 'system';
        try {
          var saved = localStorage.getItem('interview-theme');
          if (saved === 'light' || saved === 'dark' || saved === 'system') {
            mode = saved;
          }
        } catch (e) {}
        var prefersDark = false;
        try {
          prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        } catch (e) {}
        var resolved = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        var root = document.documentElement;
        root.dataset.theme = resolved;
        root.dataset.themeMode = mode;
        root.style.colorScheme = resolved;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute('content', resolved === 'dark' ? darkBg : lightBg);
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
