name: Deploy to VPS

on:
  push:
    branches:
      - main
    # 题库内容在 content/**/*.md，绝对不能忽略 md，
    # 否则改题不会触发发布。
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'LICENSE'
      - '*.txt'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Test, Build & Rsync to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.21.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck (vue-tsc + tsc)
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build production bundle
        run: pnpm build

      - name: Verify build output
        run: |
          test -f dist/index.html      || { echo "::error::dist/index.html missing"; exit 1; }
          test -f dist/404.html        || { echo "::error::dist/404.html missing"; exit 1; }
          test -d dist/assets          || { echo "::error::dist/assets missing"; exit 1; }
          echo "build files: $(find dist -type f | wc -l)"

      - name: Check required secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          missing=0
          for name in VPS_HOST VPS_PORT VPS_USER VPS_SSH_KEY VPS_TARGET_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret $name is not set"
              missing=1
            fi
          done
          exit $missing

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -T 20 -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
              -o BatchMode=yes -o ConnectTimeout=20 \
              "${VPS_USER}@${VPS_HOST}" 'echo "ssh ok: $(hostname)"'

      - name: Rsync dist/ to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          rsync -az --delete --chmod=D755,F644 \
            -e "ssh -i ~/.ssh/deploy_key -p ${VPS_PORT} -o BatchMode=yes" \
            dist/ "${VPS_USER}@${VPS_HOST}:${VPS_TARGET_DIR}/"

      - name: Fix permissions and reload nginx on VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_TARGET_DIR: ${{ secrets.VPS_TARGET_DIR }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VPS_PORT" \
              -o BatchMode=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "TARGET_DIR='${VPS_TARGET_DIR}' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail
          D="${TARGET_DIR:?VPS_TARGET_DIR not passed}"

          # rsync 从 tar/Windows 带过来的 777 权限会让所有人为可写，必须统一修正
          find "$D" -type d -exec chmod 755 {} +
          find "$D" -type f -exec chmod 644 {} +
          chown -R www-data:www-data "$D"

          # 自检：不允许存在组可写或全局可写文件
          BAD=$(find "$D" -type f -perm /022 | wc -l)
          if [ "$BAD" -ne 0 ]; then
            echo "::error::$BAD files are group/world writable"
            exit 1
          fi

          nginx -t
          systemctl reload nginx
          echo "post-deploy ok: $(find "$D" -type f | wc -l) files, nginx reloaded"
          REMOTE_SCRIPT

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
